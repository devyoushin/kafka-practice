apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
  namespace: kafka
spec:
  kafka:
    version: 3.7.0
    metadataVersion: "3.7-IV4"
    replicas: 3                        # 최소 3 브로커 권장
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false                     # 클러스터 내부 테스트용 (운영 비권장)
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512          # SASL_SSL (운영 권장)
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
      superUsers:
        - User:admin
    config:
      # 복제 설정
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # 성능 설정
      num.network.threads: 8
      num.io.threads: 16
      socket.send.buffer.bytes: 102400
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 104857600
      # 로그 설정
      log.retention.hours: 168         # 7일
      log.segment.bytes: 1073741824    # 1GB
      log.retention.check.interval.ms: 300000
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 100Gi
          deleteClaim: false
          class: gp3                   # AWS EKS 권장 StorageClass
    resources:
      requests:
        memory: 8Gi
        cpu: "2"
      limits:
        memory: 8Gi
        cpu: "4"
    jvmOptions:
      -Xms: 4096m
      -Xmx: 4096m
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics-config
          key: kafka-metrics-config.yml
  # Consumer Lag 모니터링 (Kafka Exporter)
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests:
        memory: 64Mi
        cpu: "200m"
      limits:
        memory: 128Mi
        cpu: "500m"
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: "200m"
        limits:
          memory: 512Mi
          cpu: "500m"
    userOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: "200m"
        limits:
          memory: 512Mi
          cpu: "500m"
  # Cluster CA 유효 기간 설정
  clusterCa:
    generateCertificateAuthority: true
    validityDays: 3650
    renewalDays: 30
  clientsCa:
    generateCertificateAuthority: true
    validityDays: 3650
    renewalDays: 30
---
# Kafka JMX 지표 수집 설정
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics-config
  namespace: kafka
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: "kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value"
        name: kafka_server_replicamanager_underreplicatedpartitions
        type: GAUGE
      - pattern: "kafka.controller<type=KafkaController, name=ActiveControllerCount><>Value"
        name: kafka_controller_kafkacontroller_activecontrollercount
        type: GAUGE
      - pattern: "kafka.server<type=BrokerTopicMetrics, name=BytesInPerSec><>OneMinuteRate"
        name: kafka_server_brokertopicmetrics_bytesinpersec
        type: GAUGE
      - pattern: "kafka.server<type=BrokerTopicMetrics, name=BytesOutPerSec><>OneMinuteRate"
        name: kafka_server_brokertopicmetrics_bytesoutpersec
        type: GAUGE
      - pattern: "kafka.server<type=BrokerTopicMetrics, name=MessagesInPerSec><>OneMinuteRate"
        name: kafka_server_brokertopicmetrics_messagesinpersec
        type: GAUGE
      - pattern: "kafka.network<type=RequestMetrics, name=TotalTimeMs, request=(.+)><>99thPercentile"
        name: kafka_network_requestmetrics_totaltimems_p99
        type: GAUGE
        labels:
          request: "$1"
